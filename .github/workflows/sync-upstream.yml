name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase fork patch onto upstream main
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/miuuyy/codex-chatgpt-web.git
          git fetch upstream main --prune

          before="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$before" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rebase upstream/main
          after="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$after" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.sync.outputs.changed == 'true'
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        if: steps.sync.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        if: steps.sync.outputs.changed == 'true'
        run: bun install --frozen-lockfile
        working-directory: launcher

      - name: Verify rebased source before publishing it
        if: steps.sync.outputs.changed == 'true'
        run: bun run verify

      - name: Update fork main
        if: steps.sync.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:main

  build-windows:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/patched-windows.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
